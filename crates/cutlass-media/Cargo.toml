# Planned per-platform backends (added behind feature flags), see ARCHITECTURE.md:
#   apple   → VideoToolbox    (App Store safe, hardware)
#   android → MediaCodec (NDK)
#   windows → Media Foundation
#   linux   → FFmpeg (VAAPI)  — kept off Apple/Android targets for licensing
#   audio   → symphonia       (pure-Rust, license-safe decode)
